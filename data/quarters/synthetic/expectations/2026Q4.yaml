      readiness, so the strict reading is kept for consistency with X-104, X-119 and X-302, pinned in
      tests/test_threshold_boundaries.py, and listed under "Policy ambiguities" for a human to settle.
      Mark 12.96 and Ready matched. Kept as first written.

# disposition is the older finding-level vocabulary (two REVIEW families -> BLOCK); flags_include /
# flags_exclude name rule ids that must / must not be on the position. Market provider for this date
# is `synthetic`, so X-401/X-402 use the absolute 30x / 3x bounds and M-080 does not calibrate.

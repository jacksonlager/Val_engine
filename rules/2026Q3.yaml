# HC Valuation Engine — policy 2026Q3 (v0.1)
# Every threshold the engine uses lives here. There are no numeric literals in engine code.
# A change to any value below is a policy change: bump policy_version and record why.

policy_version: "2026Q3-0.2"     # 0.2: M-080 calibration on, gated to a live comps history
inherits: null

quarter:
  label: "Q3 2026"
  measurement_date: 2026-09-30
  prior_close: 2026-06-30
  window_start: 2026-07-01
  window_end: 2026-09-30

metrics:
  reporting_lag_months: 1          # operating metrics are "as of late August"; age runway by this

marking:
  secondary:
    remainder_basis: last_round      # last_round | secondary_price
  ipo:
    price_source: market_close       # market_close | ipo_print
    lockup_discount_pct: 0.00
  announced:
    treatment: probability_weighted  # probability_weighted | full_deal_value | hold_prior
    close_probability: 0.90
  convertible:
    new_money_basis: cost
  down_round:
    structure_haircut_pct: 0.25      # M-012: a priced placeholder for preference / pay-to-play the columns cannot see
  calibration:                       # M-080: the stale-round adjustment (docs/valuation-policy.md §2b)
    enabled: true
    min_age_months: 24
    bound_pct: 0.35
    require_live_history: true       # only an observed public-comps history calibrates; the fixture never does
    round_month_tolerance: 3         # nearest month with a basket value within ±3 months of the round month

exceptions:
  staleness:
    monitor_months: 24
    review_months: 48
  arr_growth:
    monitor_below: 0.00
    review_below: -0.15
  runway:
    monitor_below_mo: 12
    review_below_mo: 6
  dilution:
    monitor_relative_drop: 0.20
  secondary:
    spread_tolerance_pct: 0.05
  multiple:
    mode: relative_to_comps          # absolute | relative_to_comps — relative screens against the live sector median
    require_live_comps: true         # ... only where the sector's comps are observed (live:*); else the absolute bounds
    absolute_high: 30
    absolute_low: 3
    high_x_comp: 2.0
    low_x_comp: 0.5
    min_arr: 0.5
  moic:
    monitor_above: 5.0
  performance_gap:
    enabled: true                    # X-405: stale price + a live performance screen against it -> REVIEW
  indications:                       # X-109 / X-118: context until the price moves far enough to matter
    term_sheet_review_below: 0.80    # a term sheet at ≤ 80% of the last round is evidence the mark is high
    note_cap_review_below: 0.80      # X-108: a bridge capped at ≤ 80% of the last round says the same thing
    insider_round_review_step_up: 2.0  # insiders re-pricing their own position ≥ 2× is not a market test
    step_up_review_at: 3.0             # X-122: a ≥ 3× step-up with no outside investor named on the row
    cheque_price_tolerance: 0.10       # X-119: HC's cheque ÷ stake bought vs the stated post, beyond ±10%
    cheque_check_min_ownership_delta: 0.01    # without a round size on the row, the cheque check needs ≥ 1pp bought to say anything
    ownership_rounding: 0.0005                # half a unit of the 3-dp ownership column; the check allows ± one unit each side
    cheque_ownership_tolerance: 0.015         # with a round size on the row, the stake may differ from the round arithmetic by up to
                                              # 1.5pp (a pool top-up, a small note converting) before X-119 asks; beyond that a cell is wrong
    restructure_ownership_tolerance: 0.0005   # a split that also moves the stake beyond this is a cap-table change (X-133 REVIEW)
  escalation:
    review_rules_to_block: 2         # distinct REVIEW families needed to escalate to BLOCK

tolerances:
  prior_mark_reconciliation_musd: 0.05
  late_event_grace_days: 91          # a row dated up to this many days before window_start is applied (X-905 REVIEW);
                                     # older, or dated after the measurement date: refused (X-905 BLOCK)

sensitivity:
  multiple_shock_pct: [-0.20, 0.20]
  software_sectors: ["AI/ML", "Developer Tools", "Enterprise SaaS", "Fintech", "Cybersecurity", "Data & Analytics", "Infrastructure"]

# ---- forward compatibility: for quarters this policy has not seen ----
schema:
  activity_sheet_pattern: '^Q[1-4] \d{4} Activity$'
  portfolio_sheet_name: "Portfolio"
  unknown_event_type: block          # block | (nothing else is allowed)
  unknown_column: record_and_warn
  missing_required_column: fail
  unknown_sector: absolute_thresholds_and_flag

note_screen:
  enabled: true
  # Whole-word matches; a negated term ("no default", "without escrow") does not fire. `exempt`
  # lists, per event type, the terms that row's own rule already handles.
  exempt:
    "IPO": [lock-up]
    "Direct Listing": [lock-up]
    "Ownership Adjustment": [warrant, conversion, restated, restatement, ratchet, anti-dilution, pool, true-up]   # M-013 asks what moved the stake
    "Convertible Note": [conversion]
    "Note Repaid": [conversion, accrued, interest, par, redemption]
    "Bankruptcy (Chapter 11)": [write-off, impairment, going concern, default, bankruptcy]   # M-025 already says the mark is impaired
    "Shutdown": [write-off, liquidation, wind down, wind-down, bankruptcy]
    "Distribution": [escrow, holdback, earn-out, earnout, milestone, contingent, indemnification, indemnity, deferred]   # a distribution is their resolution
    "Term Sheet Withdrawn": [withdrawn, cancelled, canceled, terminated, rescinded, supersedes, superseded]
    "Acquisition (Terminated)": [withdrawn, cancelled, canceled, terminated, rescinded, fee, fees]
    "Valuation Adjustment": [impairment, write-down, writedown, write-off, restated, restatement]
    "Debt Facility": [covenant, default, guarantee, tranche]
    "Lock-up Expiry": [lock-up]
    "Share Restructure": [conversion, restated, restatement]
  terms: [escrow, holdback, earn-out, earnout, milestone, contingent, participating,
          ratchet, preference, litigation, restated, bankruptcy, conversion,
          warrant, pay-to-play, cram, cram-down, lock-up, related party, going concern,
          covenant, default,
          # added with the case catalogue: the deterministic floor under the note reader
          withdrawn, cancelled, canceled, terminated, rescinded, supersedes, superseded, accrued,
          anti-dilution, waived, indemnification, indemnity, clawback, side letter, guarantee,
          redemption, impairment, write-down, writedown, write-off, recapitalization,
          insolvency, receivership, lawsuit, dispute, fraud, restatement, rollover, stock-for-stock,
          layoffs, missed payroll, pari passu, waterfall, reconcile, reconciled, do not reconcile, does not reconcile,
          liquidating, dissolved, dissolution, sale of the business, wound up, all-stock, acquirer shares,
          shares of the acquirer, stock consideration, insolvent, euros, pounds, sterling, pre-money, pre money, payroll]
  # NB: a term that appears in the shipped Q3 2026 notes in a routine sense (pro rata, cash,
  # interest, bridge, recap, extension) is deliberately not on this list; the reader covers those.

# ---- ingest normalization tolerances (training/SPEC.md §1.2, §2) ----
# How far a cell may be from a known spelling before the reader refuses to read it.
# Every correction the reader makes is recorded as an X-911..X-920 issue; nothing is silent.
normalization:
  event_type_max_distance: 2         # Damerau-Levenshtein budget for an event-type typo
  company_max_distance: 1            # ... for a company name
  header_max_distance: 2             # ... for a column header
  min_length_for_fuzzy: 6            # shorter tokens are never typo-matched (event types, headers)
  company_min_length_for_fuzzy: 8    # typo tolerance on company names only from this length
  unit_suspect_musd_above: 100000    # a $M cell above this was typed in dollars: divide by 1e6, X-916
  percent_points_above: 1.0          # a percent field above this was typed in points: divide by 100, X-916
  percent_block_above: 100           # ... and above this it is neither fraction nor points: block
  header_scan_rows: 10               # rows searched for the header row
  header_min_known_columns: 3        # known columns a row must carry to be taken as the header

open_items:
  announced_deal_stale_quarters: 2
  term_sheet_stale_quarters: 1
  note_unconverted_quarters: 3
  ipo_lockup_days: 180
  unconfirmed_exit_stale_quarters: 1   # an exit closed with no cash recorded, held on the book, escalates every quarter (D-9)

adjudication:
  enabled: true
  provider: claude                   # stub | claude — Claude drafts; the stub answers when no model is reachable
  auto_accept: never                 # not a threshold. there is no value here.
  cache_proposals: true
  promote_after_repeats: 3
  allowed_fields: [ownership_before, ownership_after, post_money, deal_value,
                   proceeds, prior_mark, hc_investment, close_probability, note_at_cost]
  allowed_operators: ["*", "/", "+", "-", "min", "max"]

# Four eyes on the release: the publisher may not be the approver on any override this quarter.
publish:
  require_second_approver: true

# The per-company flag archive. It fills itself from the publish ledger: release Q3 and next
# quarter's panel shows what each position was flagged for this quarter. Q3 2026 is the first
# quarter on the engine, so nothing was released before it and the prior quarter reads "not on
# record" — which is the truth. Setting `reconstruct_prior_flags: true` instead re-screens the
# prior-close book under this policy and labels those points `reconstructed`; defensible as an
# estimate, but it is not what any committee saw, so it is off.
history:
  reconstruct_prior_flags: false

# Who picks the one resolution shown first on each BLOCK/REVIEW flag. `claude` chooses among the
# engine's priced suggestions (never a number of its own) and caches answers in data/recommendations/;
# set ANTHROPIC_API_KEY and run `hc-valuation recommend` once to fill the cache.
#
# Two levels. Each actionable flag gets its own recommendation, which is what prices the options
# a reviewer picks from; on top of it each position gets ONE next step, chosen across all its
# findings — which to act on first and what it settles. That cross-finding call is the judgment
# a model is useful for; the per-flag one is mostly the rule's own default restated. Either way
# the step must name a finding on the position and one of that finding's priced suggestions, and
# the number comes from the suggestion. Without a key it falls back to the policy default (lead
# with the first finding) and the card says so.
recommendation:
  provider: claude                   # policy | claude
  model: claude-sonnet-4-5
  cache: true

# The note reader: Claude reads each activity row's Detail and Notes against the case catalogue
# (src/hc_valuation/notes/catalogue.py) and says, quoting, what the text contains that the columns
# do not. The engine turns that into review findings and nothing else — never a number. Cached
# under data/note_reads/. Off without ANTHROPIC_API_KEY; the keyword screen above still runs.
note_reader:
  provider: claude                   # off | claude
  model: claude-sonnet-4-5
  cache: true

# Declarative rules promoted from E-09 adjudication land here. Empty for the base quarter.
custom_rules: []

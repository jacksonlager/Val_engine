# Why each exception rule exists and why it carries the severity it does.
#
# This is policy documentation, not logic: the engine raises the flags in engine/exceptions.py
# and engine/marking.py; this file is what the review tool shows beside them (Rules tab and
# the flag detail panel) so a reviewer or an auditor can see the reasoning without opening
# the code. Every rule id that can appear on a position must have an entry — tests enforce it.
#
# source:
#   brief  — the exception is one Tom's assessment named ("activity where the right treatment
#            is not mechanical, stale rounds, shrinking ARR, short runway, or a mark that no
#            longer squares with performance"); `brief_text` quotes the phrase it answers.
#   policy — a rule we added because a VC finance team would expect it ("you choose the rules;
#            be ready to defend them"). The two bullets are the defence.
#
# The one test behind every severity: could a reviewer, looking at this, change the booked
# number? No → Noted. Plausibly → Needs a review. Cannot be booked until someone chooses →
# Blocks approval.

version: 2026Q3-0.2
groups:
  - key: treatment
    title: Treatment
    description: What happened this quarter, and whether pricing it took a judgment call.
    brief_text: activity where the right treatment is not mechanical
  - key: related_party
    title: Related-party pricing
    description: Who set the price, and whether that made it arm's-length.
    brief_text: null
  - key: notes
    title: Note language
    description: What the row's free text says that its columns cannot hold.
    brief_text: null
  - key: staleness
    title: Staleness
    description: How old the price the mark rests on has become.
    brief_text: stale rounds
  - key: growth
    title: Growth
    description: Whether revenue has moved against the round that set the price.
    brief_text: shrinking ARR
  - key: liquidity
    title: Liquidity
    description: How long the cash lasts, and what a raise before then would cost.
    brief_text: short runway
  - key: valuation
    title: Valuation
    description: Whether the implied multiple still squares with the public comparables.
    brief_text: a mark that no longer squares with performance
  - key: data
    title: Ingest
    description: Whether the workbook row could be read, and read correctly.
    brief_text: null

rules:
  # ---------------------------------------------------------------- treatment
  - id: X-101
    name: The rule had to choose
    family: treatment
    severity: [BLOCK, REVIEW]
    source: brief
    brief_text: activity where the right treatment is not mechanical
    reads: Event, Detail, Post-Money / Deal Value, HC Ownership After, Proceeds to HC
    trigger: "Announced deal, IPO, or exit proceeds ≠ stake × deal value"
    why_flag: >-
      A signed-but-unclosed deal, an IPO, an exit with no cash on the row, or a secondary that
      does not reconcile: the base rule ("ownership × post-money") has no single answer, so the
      engine books a policy default (for a signed deal, 0.9 × deal value + 0.1 × hold) and refuses
      to book it unratified.
    why_severity: >-
      Because two legitimate treatments exist and a committee, not code, chooses — this is the
      brief's "activity that takes judgment". It only needs a review where the arithmetic works
      but a gap needs a reason: exit cash short of ownership × deal value (escrow? fees?), a
      shutdown that returned more than its carrying value, a note cap the text would not give up.
  - id: X-102
    name: Down round / recapitalisation
    family: treatment
    severity: [BLOCK]
    source: policy
    reads: Post-Money vs the prior Post-Money
    trigger: "Priced round with post-money below the last round"
    why_flag: >-
      The new post-money is below the prior one. Down rounds almost always carry structure —
      liquidation preference, ratchets, pay-to-play — so "ownership × post-money" is the wrong
      number for HC's specific share class.
    why_severity: >-
      Because the headline can over- or under-state HC's class: down if HC is junior to the new
      senior class, up if HC funded it. Standard practice (AICPA PE/VC guide) is a waterfall; the
      engine offers the headline, a 25% structure haircut and hold-prior, and a human picks.
  - id: X-103
    name: Dilution, HC did not participate
    family: treatment
    severity: [MONITOR]
    source: policy
    reads: Ownership (FD %) before vs HC Ownership After, HC Investment
    trigger: "Ownership after < 80% of ownership before, no HC cheque"
    why_flag: >-
      HC skipped its pro rata and ownership fell more than 20% in relative terms — a reserves
      question the partnership should see.
    why_severity: >-
      Because the mark rests on a fresh arm's-length round: the price is fine. It is a portfolio
      signal about HC's stake, not a valuation signal, so a reviewer could not change the number.
  - id: X-104
    name: Secondary price off the last round
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: Proceeds to HC ÷ ownership sold, vs Latest Post-Money
    trigger: "Proceeds ÷ stake sold differs >5% from post-money"
    why_flag: >-
      A secondary trade implies a price for the whole company; more than 5% away from the last
      round, the market is saying something about the mark.
    why_severity: >-
      Because policy keeps the remainder at the last-round basis (a partial, negotiated print is
      weaker evidence than a primary round) but a reviewer may decide the secondary is the better
      price — "book the remainder at the secondary price" is offered as a priced option.
  - id: X-105
    name: The note carries terms the columns cannot hold
    family: notes
    severity: [REVIEW]
    source: policy
    reads: Notes text — whole words, negation-aware, exempt per event type
    trigger: "A screened term in the Notes cell, not negated, not exempt for that event"
    why_flag: >-
      The free-text Notes cell contains a term the columns cannot encode — escrow, holdback,
      earn-out, ratchet, preference, litigation, going concern. The engine never parses it into
      a number.
    why_severity: >-
      Because its only job is to guarantee a human reads that sentence. It is its own family, so a
      note plus a treatment question counts as two independent reasons and escalates.
  - id: X-106
    name: Flat extension, no price discovery
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: Detail ("extension"), Post-Money equal to the prior
    trigger: "Round with post-money equal to the last round"
    why_flag: >-
      Insiders re-upped at the old price. The mark is repriced to the new ownership, but the
      staleness clock is not reset — no new market test happened.
    why_severity: >-
      Because the brief says fresh rounds set marks and a same-terms extension is not a fresh
      price; the reviewer decides whether the old price still holds.
  - id: X-107
    name: Bridge note HC funded
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: Event = Convertible Note, HC Investment, Detail (cap)
    trigger: "Convertible Note row with an HC investment"
    why_flag: >-
      A convertible note is not a priced round — a cap is a ceiling, not a price. HC's note is
      carried at cost on its own leg and the equity mark is untouched.
    why_severity: >-
      Because a bridge HC had to fund is often a distress signal that should pull the equity leg
      down, and that is a call a reviewer can make.
  - id: X-108
    name: Bridge note HC did not fund
    family: treatment
    severity: [MONITOR, REVIEW]
    source: policy
    reads: Event = Convertible Note, HC Investment empty
    trigger: "Convertible Note row, no HC cheque; cap vs last round"
    why_flag: >-
      The company raised a note from others. Worth knowing; the cap says where the next round
      may price.
    why_severity: >-
      Because it depends where the cap sits. Above the last round the company is bridging on its way up:
      HC's position did not change, a cap is not a price, and there is nothing for a person to decide, so it
      is a watch item. At or below 80% of the last round it is the same evidence a low term sheet is — the
      next round would convert under the mark the book still carries, and HC declining to fund it says so a
      second time — and a reviewer could defensibly move the number, so it needs a review.
  - id: X-109
    name: Term sheet disclosed
    family: treatment
    severity: [MONITOR, REVIEW]
    source: policy
    reads: Event = Term Sheet, Post-Money / Deal Value vs Latest Post-Money
    trigger: "Term Sheet row; indicated post ≤ 80% of last round"
    why_flag: >-
      Non-binding, so nothing is booked; the indicated value is recorded as an open item that
      ages in the register and escalates if it never closes.
    why_severity: >-
      Noted by default; it needs a review when the indication is at or below 80% of the last
      round: a lower price in writing is evidence a market participant would not pay the carried
      price (ASC 820), so "mark down to the indication" becomes a real option.
  - id: X-124
    name: Note converted in the round
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: Event = Priced Equity Round or IPO with a note leg carried at cost, Ownership After, Post-Money
    trigger: "Round or listing with a note leg carried in"
    why_flag: >-
      HC's convertible note converts into the round: the separate note leg disappears and the whole
      stake is marked at the round price, with the note's principal in invested capital exactly once.
      The bridge questions (is the note still at cost, has it funded) are settled and are dropped;
      what remains to confirm is the conversion itself — cap or discount, accrued interest, share count.
    why_severity: >-
      Review because the closing cap table is the only evidence that the ownership on the row already
      includes the converted shares; a reviewer who takes the row at face value could double count
      the note or miss accrued interest that changes the stake.
  - id: X-125
    name: Term sheet withdrawn
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: Event = Term Sheet Withdrawn, the open term sheet and its indicated value
    trigger: "Term Sheet Withdrawn row"
    why_flag: >-
      A signed proposal fell through before closing. Nothing was booked from it, so the mark still
      rests on the last round, but an investor walking away is evidence a market participant would
      not pay that price today (ASC 820), and the company still has to raise.
    why_severity: >-
      Review because the engine cannot tell a withdrawal on terms from a withdrawal on the company;
      the reviewer weighs holding the last-round mark against a mark-down to cost pending a new raise.
  - id: X-126
    name: Operating metrics reported in prose
    family: liquidity
    severity: [REVIEW]
    source: policy
    reads: Event = Term Sheet Withdrawn or Operating Update, the row's Notes
    trigger: "Operating Update or note stating cash, burn, runway"
    why_flag: >-
      The note reports cash, burn, runway or revenue in a sentence. The engine never reads a number
      out of prose, so the runway and growth screens still run on the Portfolio tab's columns, which
      the note may supersede; a two-month runway in the note can sit behind a fifteen-month runway
      in the tab.
    why_severity: >-
      Review because the input is wrong, not the rule: a person updates the Portfolio tab from the
      note (or confirms the tab is current) and the screens re-run on the corrected figures.
  - id: X-127
    name: Debt facility ahead of the equity
    family: liquidity
    severity: [REVIEW]
    source: policy
    reads: Event = Debt Facility, Post-Money / Deal Value (facility size), HC Investment (HC's own loan)
    trigger: "Debt Facility row"
    why_flag: >-
      Debt is not a price for the equity, so the mark does not move; but the facility ranks ahead of
      HC's shares, usually carries covenants and often warrants, and the drawn cash is not on the
      Portfolio tab until a person puts it there. A loan HC itself made is carried at cost on its
      own leg until repaid.
    why_severity: >-
      Review because seniority, covenants and warrants change what the equity is worth in a
      downside and none of them is in a column; the reviewer confirms them and updates the tab.
  - id: X-128
    name: Valuation adjustment asserted on a row
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: Event = Valuation Adjustment, Post-Money / Deal Value (the stated company value)
    trigger: "Valuation Adjustment row with a stated value"
    why_flag: >-
      A write-down, impairment or write-up entered as an activity row is a judgment, not a
      transaction. The engine books transactions and observable inputs, so the proposal is the
      evidence-based mark and the stated figure is offered as a priced option.
    why_severity: >-
      Review because the row may record a decision the committee already took, or may be one
      person's opinion; either way it is booked only as an override with a named reason.
  - id: X-129
    name: Lock-up expiry
    family: treatment
    severity: [MONITOR, REVIEW]
    source: policy
    reads: Event = Lock-up Expiry, the position's listed status, the open lock-up item
    trigger: "Lock-up Expiry row; listed or not"
    why_flag: >-
      On a listed position the shares become saleable and the lock-up item closes; the mark is the
      market close as before, since a Level 1 price carries no lock-up discount under this policy.
    why_severity: >-
      Noted on a listed position: nothing to decide. A review when the book does not show the
      company as listed — the listing was never recorded on the tab or the row is on the wrong
      company, and a person has to say which.
  - id: X-133
    name: Share restructure
    family: treatment
    severity: [MONITOR, REVIEW]
    source: policy
    reads: Event = Share Restructure, HC Ownership After vs the book's ownership
    trigger: "Share Restructure row; stake moved or not"
    why_flag: >-
      A split, reverse split or reclassification changes share counts, not economics: the mark and
      the fully diluted stake are unchanged. A row that also moves the stake is either a
      non-neutral reclassification or a wrong cell.
    why_severity: >-
      Noted when the stake is unchanged. A review when the row's ownership differs from the book:
      the mark holds on the book's stake until the cap table says whether the economics moved.
  - id: X-130
    name: Note describes what no rule applied
    family: notes
    severity: [REVIEW]
    source: policy
    reads: the row's Detail and Notes as read by the note reader against the case catalogue; the terms the row's rule handled
    trigger: "Reading kind not handled by the row’s rule"
    why_flag: >-
      The reader found the text describing something from the case catalogue — an escrow, a
      preference, a restated stake, a dispute — that the row's rule did not take account of and
      the keyword screen did not name. The engine applied the columns and ignored the rest; the
      quote is on the finding so the reviewer reads exactly what it saw.
    why_severity: >-
      Review because the text may change the mark and only a person can say how; a reading is
      evidence about the text, never a number, so it can add a question but never answer one.
  - id: X-131
    name: Note conflicts with a column
    family: notes
    severity: [REVIEW]
    source: policy
    reads: a column on the row and the words in the row's text that state a different value or fact for it
    trigger: "Note figure ≠ column value on the same row"
    why_flag: >-
      The text states a figure or fact for one of the row's columns that differs from the cell —
      proceeds, ownership, a date. The engine booked the column. One of the two is wrong and the
      mark depends on which.
    why_severity: >-
      Review, in the notes family with the reader's other findings, so one row's reading cannot on
      its own turn a position into a decision; the reviewer corrects the row and reruns or decides
      by override.
  - id: X-132
    name: Note not read
    family: notes
    severity: [REVIEW]
    source: policy
    reads: the reader's failure reason for the row
    trigger: "No key, or the model failed on this row"
    why_flag: >-
      The note reader was on but could not read this row's text (a model or network failure, an
      unreadable reply). Only the keyword screen ran on it, so anything the note says beyond the
      columns is unaccounted for until a person reads it.
    why_severity: >-
      Review because a silent failure is the one outcome that could hide a material note; the
      finding clears on a rerun with the reader available, or when the note is read by hand.
  - id: X-134
    name: A figure on the row the rule does not use
    family: data
    severity: [REVIEW]
    source: policy
    reads: the row's filled columns against the columns its event type's rule reads
    trigger: "Filled column the event’s rule ignores"
    why_flag: >-
      The row carries a number in a column its rule never reads — proceeds on a term sheet, HC's
      cheque on a distribution, a stake on a dividend, a recovery estimate on a shutdown. The engine
      applied the rule and the figure went nowhere; cash, cheques and stakes must not vanish silently.
    why_severity: >-
      Review because the figure may belong to a different event type (a tender filed as a dividend,
      a secondary inside a round) or be a stray cell; a person says which and corrects the row.
  - id: X-135
    name: The row's label contradicts its price
    family: data
    severity: [REVIEW]
    source: policy
    reads: Event / Detail wording ("down round") against Post-Money vs the book's Latest Post-Money
    trigger: "“Down round” text with post ≥ last round"
    why_flag: >-
      The row calls the round a down round while the stated post-money is at or above the last
      round. One of the two is wrong, and the mark rests on the figure.
    why_severity: >-
      Review because the price is booked as stated; the reviewer confirms the figure or the label
      and the row is corrected.
  - id: X-110
    name: Ownership moved with no price event
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: Event = Ownership Adjustment, HC Ownership After
    trigger: "Ownership Adjustment row with a new stake"
    why_flag: >-
      Warrant exercise, option-pool expansion or a cap-table restatement changed HC's percentage
      with no money changing hands. Re-marked on the unchanged last-round basis.
    why_severity: >-
      Because a percentage that moved without a price is where cap-table errors hide; the reviewer
      confirms the new ownership against the cap table.
  - id: X-111
    name: Cash distribution received
    family: treatment
    severity: [MONITOR, REVIEW]
    source: policy
    reads: Event = Distribution, Proceeds to HC
    trigger: "Distribution row with proceeds, stake unchanged"
    why_flag: >-
      Cash came back with the stake unchanged (an escrow release, a dividend). Realized moves up.
    why_severity: >-
      Because it depends on the size of the cheque. Cash arriving against an unchanged stake is
      information: realized proceeds rise, the mark does not move, and there is nothing for a person
      to decide, so it is a watch item. But a distribution larger than the carrying value — or than
      everything HC ever invested — is evidence the mark was wrong rather than a routine receipt, and
      a reviewer could defensibly change the number, so that case needs a review.
  - id: X-112
    name: Consideration was shares
    family: treatment
    severity: [BLOCK]
    source: policy
    reads: Event = Acquisition, Notes / Detail ("stock", "shares")
    trigger: "Closed acquisition, no proceeds, “stock” in the text"
    why_flag: >-
      An acquisition closed for acquirer stock, not cash. The position stays active at
      ownership × deal value.
    why_severity: >-
      Because the acquirer, whether it is listed, the share count and any lock-up all change the
      number and none of them are in the feed.
  - id: X-113
    name: Listed position with no measurement-date price
    family: treatment
    severity: [BLOCK]
    source: policy
    reads: Quote feed at the measurement date
    trigger: "Listed position, no quote at the measurement date"
    why_flag: >-
      A public position needs the measurement-date close and the quote feed had none.
    why_severity: >-
      Because the engine will not carry a stale quote as if it were current; Level 1 means the
      exchange price or nothing.
  - id: X-114
    name: Announced deal fell through
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: Event = Deal Terminated
    trigger: "Acquisition (Terminated) row"
    why_flag: >-
      The mark reverts to the last-round basis after a period carried at the deal price.
    why_severity: >-
      Because the reviewer confirms nothing about that basis changed while the deal was pending —
      a failed sale is itself information about value.
  - id: X-115
    name: Note repaid
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: Event = Note Repaid, Proceeds to HC
    trigger: "Note Repaid row with proceeds"
    why_flag: >-
      Principal on a note HC held came back as cash; realized moves up and the note leg is closed.
    why_severity: >-
      Because if the note sat inside the prior mark rather than on its own leg, the carrying basis
      should come down by the principal — a reviewer has to know which.
  - id: X-116
    name: Chapter 11
    family: treatment
    severity: [BLOCK]
    source: policy
    reads: Event = Bankruptcy / Chapter 11
    trigger: "Bankruptcy (Chapter 11) row"
    why_flag: >-
      Reorganisation. The mark is unchanged and the position is not terminal.
    why_severity: >-
      Because the carrying value is almost certainly impaired and the recovery estimate is a
      human's job.
  - id: X-117
    name: HC-led round
    family: related_party
    severity: [REVIEW]
    source: policy
    reads: Notes / Detail ("led by HC", "HC-led")
    trigger: "Round text says “led by HC”"
    why_flag: >-
      The round that sets the new mark was led by Human Capital. A related-party price is not
      arm's-length.
    why_severity: >-
      Because HC pricing its own mark is the classic auditor question; the reviewer confirms an
      independent investor set or validated the price.
  - id: X-118
    name: Insider-led round
    family: related_party
    severity: [MONITOR, REVIEW]
    source: policy
    reads: Notes / Detail ("insider"), Post-Money vs the prior
    trigger: "Round text says “insider”; post ≥ 2× prior"
    why_flag: >-
      Existing investors, not HC, priced the round. Weaker evidence than new money at the table.
    why_severity: >-
      Noted because insiders are still third parties; it needs a review when they re-priced the
      company 2× or more with no new investor testing it — a reviewer could reasonably book less,
      and "hold the prior mark" is offered.
  - id: X-119
    name: Cheque price mismatch
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: HC Investment ÷ change in ownership, vs Post-Money
    trigger: "HC investment ÷ stake bought vs post-money, >10% off"
    why_flag: >-
      HC's cheque divided by the stake it bought implies a different post-money than the row
      states, by more than 10% (only when HC bought at least a percentage point).
    why_severity: >-
      Because one of the two cells is wrong or HC bought at a different price from the headline;
      "book at the cheque price" is a priced option.
  - id: X-123
    name: Stake rose without a cheque
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: HC Ownership After vs the book's ownership, HC Investment on a priced round
    trigger: "Ownership after > before, no HC investment"
    why_flag: >-
      HC's stake went up in a round HC did not fund. Anti-dilution, a ratchet or a warrant
      exercise does that legitimately; a mis-typed ownership cell does it too, and the row cannot
      say which. The mark rises with the stated stake either way.
    why_severity: >-
      Because the mark rests on a mechanism the workbook does not show: a person confirms the
      protection from the round documents, or books the prior stake against the new post-money
      until it is confirmed. The rule that screens dilution (X-103) only looked one way.
  - id: X-120
    name: New position entered at cost
    family: treatment
    severity: [MONITOR]
    source: policy
    reads: Event = New Investment
    trigger: "New Investment row"
    why_flag: >-
      First investment in the quarter, created from the activity tab.
    why_severity: >-
      Because cost is the fair value of a round that just closed; nothing to decide.
  - id: X-121
    name: Secondary purchase at the last-round price
    family: treatment
    severity: [MONITOR]
    source: policy
    reads: Proceeds ÷ ownership bought, vs Latest Post-Money
    trigger: "Secondary Purchase row within 5% of post-money"
    why_flag: >-
      HC bought more and the implied price is within 5% of the last round.
    why_severity: >-
      Because inside the tolerance it is the same price with negotiation noise; outside it X-104
      carries the spread instead.
  - id: X-122
    name: Outsized step-up
    family: treatment
    severity: [MONITOR, REVIEW]
    source: policy
    reads: Post-Money ÷ the prior Post-Money, Notes ("led by", "new investor")
    trigger: "Post-money ≥ 3× prior; no outside lead named"
    why_flag: >-
      A priced round re-priced the company 3× or more against the prior post-money.
    why_severity: >-
      Noted when the notes name a new lead or outside investor — the price was tested. It needs
      a review otherwise: a step-up that size with nobody new at the table is a price a reviewer
      should confirm, and "hold the prior mark" is offered.
  - id: M-999
    name: Unrecognised event type
    family: treatment
    severity: [BLOCK]
    source: policy
    reads: Event cell
    trigger: "Event cell not in the catalogue (e.g. SPAC Merger)"
    why_flag: >-
      An event the rule file does not know. The position halts with its prior mark; it never
      falls through to "carry".
    why_severity: >-
      Because the difference between an engine that says "I don't know what a SPAC merger is" and
      one that reports an unchanged mark and looks confident doing it is the whole point. An
      rule for the new event type is written into the policy file by a person before it can price.

  # ---------------------------------------------------------------- staleness
  - id: X-201
    name: Round older than 24 months
    family: staleness
    severity: [MONITOR]
    source: brief
    brief_text: stale rounds
    reads: Latest Round date → age at the measurement date (extensions do not reset it)
    trigger: "Latest round more than 24 months before quarter end"
    why_flag: >-
      Venture companies raise every 18–24 months; one cycle without a price means the mark is
      due a refresh.
    why_severity: >-
      Because age alone is not evidence the value moved. Named in the brief, so it is always
      visible — but a reviewer has nothing to change yet. On a company with a signed deal pending,
      the deal is the price test and this stays a watch item.
  - id: X-202
    name: Round older than 48 months
    family: staleness
    severity: [REVIEW]
    source: brief
    brief_text: stale rounds
    reads: Latest Round date → age at the measurement date
    trigger: "Latest round more than 48 months before quarter end"
    why_flag: >-
      Two cycles without a price — the round probably predates the business it now describes.
    why_severity: >-
      Because this is the brief's core exception: a reviewer could reasonably move the mark.
      Carries the comps-calibration option (M-080) as a priced alternative when live comps history
      can price the move since the round.

  # ---------------------------------------------------------------- growth
  - id: X-301
    name: ARR contracting
    family: growth
    severity: [MONITOR]
    source: brief
    brief_text: shrinking ARR
    reads: ARR Growth (YoY %)
    trigger: "ARR growth column below 0%"
    why_flag: >-
      Year-on-year ARR growth below 0%. Any contraction in a growth company is worth noticing.
    why_severity: >-
      Because mild contraction does not by itself invalidate the last round's price; it becomes a
      case only when combined with a stale price (X-405).
  - id: X-302
    name: ARR down more than 15%
    family: growth
    severity: [REVIEW]
    source: brief
    brief_text: shrinking ARR
    reads: ARR Growth (YoY %)
    trigger: "ARR growth column below −15%"
    why_flag: >-
      Roughly one lost growth cohort — the growth assumptions behind the last round no longer hold.
    why_severity: >-
      Because the brief names shrinking ARR as an exception and at −15% a reviewer could
      reasonably mark down; the number is theirs to confirm.

  # ---------------------------------------------------------------- liquidity
  - id: X-303
    name: Runway under 12 months
    family: liquidity
    severity: [MONITOR]
    source: brief
    brief_text: short runway
    reads: Cash ÷ Net Burn, aged by the reporting lag (metrics are a month behind the marks)
    trigger: "Cash ÷ burn, aged one month, under 12"
    why_flag: >-
      One raise cycle of cash — the company must be in market this quarter.
    why_severity: >-
      Because twelve months is normal between rounds; it is context until it gets tight.
  - id: X-304
    name: Runway under 6 months
    family: liquidity
    severity: [REVIEW]
    source: brief
    brief_text: short runway
    reads: Cash ÷ Net Burn, aged one month
    trigger: "Cash ÷ burn, aged one month, under 6"
    why_flag: >-
      The company must close a round before the next measurement date or fail.
    why_severity: >-
      Because this is the brief's "short runway": a going-concern risk a reviewer may need to
      reflect in the mark (down round, bridge, write-down).

  # ---------------------------------------------------------------- valuation
  - id: X-401
    name: Revenue multiple high
    family: valuation
    severity: [MONITOR]
    source: brief
    brief_text: a mark that no longer squares with performance
    reads: Latest Post-Money ÷ ARR vs the public EV ÷ TTM-revenue median of the sector basket
    trigger: "Post-money ÷ ARR > 2× sector median"
    why_flag: >-
      Implied post-money ÷ ARR is more than 2× the live sector median (30× when no live comps
      are on file) — the mark is rich against public peers. Post-money is not enterprise value
      and ARR is not trailing revenue, and growth is not adjusted for: a screen, not a valuation.
    why_severity: >-
      Because a multiple is a screen, not a valuation; on a fresh round the price is the price. It
      needs a review only when paired with a stale anchor (X-405).
  - id: X-402
    name: Revenue multiple low
    family: valuation
    severity: [MONITOR]
    source: brief
    brief_text: a mark that no longer squares with performance
    reads: Latest Post-Money ÷ ARR vs the public EV ÷ TTM-revenue median of the sector basket
    trigger: "Post-money ÷ ARR < 0.5× sector median"
    why_flag: >-
      Implied post-money ÷ ARR is below 0.5× the live sector median (3× absolute). Fires in the
      other direction too — a stale-low mark is also wrong.
    why_severity: >-
      For the same reason as X-401: a screen, not a valuation, until a stale price is arguing
      with it.
  - id: X-403
    name: ARR below the screening floor
    family: valuation
    severity: [MONITOR]
    source: policy
    reads: ARR ($M)
    trigger: "ARR column under $0.5M"
    why_flag: >-
      ARR under $0.5M — any multiple on that base is meaningless, so the company sits in its own
      bucket rather than being screened.
    why_severity: >-
      Because it is a statement about the screen, not the company.
  - id: X-404
    name: MOIC outlier on a stale round
    family: valuation
    severity: [MONITOR]
    source: policy
    reads: Prior Mark ÷ Invested, Latest Round date
    trigger: "Mark ÷ invested > 5× and round > 24 months"
    why_flag: >-
      An unrealised multiple on cost above 5× resting on a round older than 24 months — where
      optimistic write-ups hide.
    why_severity: >-
      Because a big gain is not evidence of a move; it is the kind of context an auditor asks
      about, so it stays visible and feeds X-405.
  - id: X-405
    name: Stale price with a screen against it
    family: valuation
    severity: [REVIEW]
    source: brief
    brief_text: a mark that no longer squares with performance
    reads: Latest Round date plus the X-3xx / X-4xx screens
    trigger: "Round > 24 months plus X-301/401/402/404"
    why_flag: >-
      An anchor older than 24 months and a live screen (high or low multiple, MOIC outlier, ARR
      contraction) arguing with it — exactly the brief's "performance has moved away from the
      last mark".
    why_severity: >-
      Because each half alone is only a watch item; together they are the case the brief
      describes. Suppressed when X-202 or X-302 already put the position under review, so nothing
      is counted twice. The comps calibration is offered as a resolution only when it moves the
      mark the way the screen points; a calibration against the screen is disclosed, not offered.

  # ---------------------------------------------------------------- ledger
  - id: E-01
    name: Override drift
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: the override ledger vs the current proposal
    trigger: "Override on file, proposal moved since"
    why_flag: >-
      A committee override exists for this company and quarter but the proposal it was written
      against has since changed (a refreshed file, a policy change).
    why_severity: >-
      Because the booked number may no longer match the reason recorded for it; the reason is
      re-read against the new proposal.
  - id: E-07
    name: Aged open item
    family: treatment
    severity: [REVIEW]
    source: policy
    reads: the open-items register carried from prior quarters
    trigger: "Carried open item past its policy age"
    why_flag: >-
      An item outlived its allowance: a deal pending more than two quarters, a term sheet older
      than one, a note unconverted after three, a lock-up past expiry.
    why_severity: >-
      Because unfinished business that spans a quarter boundary should not depend on someone
      remembering it.

  # ---------------------------------------------------------------- ingest
  - id: X-900
    name: Row refused, position blocked
    family: data
    severity: [BLOCK]
    source: policy
    reads: every cell on both tabs (X-901 … X-922 name the specific issue)
    trigger: "Any X-901 to X-925 blocking issue on the row"
    why_flag: >-
      An unknown company, a missing post-money, ownership outside 0–100%, a euro cell, a
      duplicate row, an event dated after the measurement date. The row is recorded and not applied; the prior
      mark carries.
    why_severity: >-
      Because the brief asks that a refreshed file "flow through without rework", and the honest
      version of that is refusing a cell rather than guessing it — a number nobody read cannot be
      booked.
  - id: X-924
    name: New investment on a company already held
    family: data
    severity: [BLOCK]
    source: policy
    reads: Event = New Investment on a company the Portfolio tab already carries with ownership or invested capital
    trigger: "New Investment for a company already in the book"
    why_flag: >-
      A first cheque cannot be a second one. Applying the row would add HC's money again and re-mark a
      position the book already carries at the same round — a double count. Either the row is wrong
      or the Portfolio row is, and the workbook cannot say which.
    why_severity: >-
      Blocks approval, on the row: nothing from it is applied, the prior mark is carried, and the position
      stays Blocked until one of the two records is removed and the quarter rerun.
  - id: X-926
    name: Dates out of order on a position
    family: data
    severity: [REVIEW]
    source: policy
    reads: First Investment, Latest Round
    trigger: "First Investment date later than Latest Round"
    why_flag: >-
      The first cheque into a company cannot post-date its latest round. One of the two dates is
      a typo, and nothing in the row says which.
    why_severity: >-
      Because the mark itself does not rest on either date, but the staleness clock does: every
      screen that asks how old the price behind the mark is runs from Latest Round. A person
      confirms which date is right before that clock is trusted.
  - id: X-923
    name: Row applied on a corrected reading
    family: data
    severity: [REVIEW]
    source: policy
    reads: an ingest correction that needs review, anchored to a row that was applied (X-904, X-905 inside grace, X-916)
    trigger: "Unit, date or basis correction applied to a row"
    why_flag: >-
      Ingest read the cell the way a person would — 5.5 as 5.5%, a row dated a week before the
      window as a transaction missed at the last close, a prior mark that departs from the last
      round as an explained departure — and the mark moved on that reading. Nobody has confirmed
      it. A corrected reading that changes a number and reads clean is a number nobody read.
    why_severity: >-
      Because the row is plausible and was applied: the engine has a proposal, and a person
      confirms the reading or fixes the cell. A cell that could not be read at all blocks approval
      instead (X-900).
  - id: X-918
    name: New company created from activity
    family: data
    severity: [REVIEW]
    source: policy
    reads: Event = New Investment for a company not on the Portfolio tab
    trigger: "New Investment for a name not on the Portfolio tab"
    why_flag: >-
      The activity tab names a company the book does not have. The position is created at cost
      so the cheque is not lost.
    why_severity: >-
      Because the Portfolio row is missing: sector, fund, stage and the operating metrics all need
      to be added before the position can be screened like the others.

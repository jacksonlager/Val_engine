name: 08_structure
description: >
  A workbook that has been "tidied" by a human: two title rows (the first a merged cell) above
  the header on both tabs, a blank row after every third data row, a "Total" row summing the
  money columns, and a trailing source note. The reader must find the header on row 3, skip the
  decoration (X-917, once per sheet, with counts), read exactly 100 positions and 5 events, and
  never mistake "Total" or the note for a company.
base: HC_Mock_Portfolio_Data.xlsx
policy: 2026Q3
structure:
  portfolio: { title_rows: 2, titles: ["HC Portfolio — book as of the June 30, 2026 close", "Prepared by HC Finance, 2026-10-02"], blank_rows_every: 10, totals_row: true, trailing_note: "Source: fund administrator ledger; operating metrics from board decks." }
  activity:  { title_rows: 2, titles: ["Q3 2026 Portfolio Activity", "Every event between July 1 and September 30, 2026"], blank_rows_every: 3, totals_row: true, trailing_note: "Source: closing binders and board consents." }
activity:
  - { date: 2026-07-10, company: Solvantra, event: "Priced Equity Round", detail: "Series B", value: 100.0, hc_investment: 1.0, ownership_after: 0.11,
      notes: "$24.0M round led by a new investor. HC participated." }
  - { date: 2026-07-14, company: Kilnbrook, event: "Convertible Note", detail: "$3.0M bridge note, $80.0M valuation cap", hc_investment: 0.5,
      notes: "Uncapped interest, converts at next priced round. HC participated in the note." }
  - { date: 2026-07-28, company: Ambercrest, event: "Acquisition (Closed)", detail: "All-cash acquisition", value: 400.0, proceeds: 16.8,
      notes: "Transaction closed and cash received during the quarter." }
  - { date: 2026-08-03, company: Oxbowlane, event: "Acquisition (Announced)", detail: "Definitive agreement signed, all cash", value: 500.0,
      notes: "Expected to close in Q4 2026, subject to regulatory approval. No cash received." }
  - { date: 2026-08-14, company: "Willowmere Compute", event: "Term Sheet Signed", detail: "Series B term sheet at ~$60.0M post", value: 60.0,
      notes: "Not closed; diligence underway, expected to close Q4." }
expect:
  ingest_ok: true
  no_crash: true
  validation_ids: { must: [X-917], must_not: [X-901, X-909, X-902, X-903, X-904, X-914] }
  validation_must:
    - { id: X-917, contains: "Total" }
    - { id: X-917, contains: "blank" }
  validation_must_not:
    - { id: X-901, company: "Total" }
  validation_blocking: false
  totals: { events: 5, positions: 100 }
  companies:
    Total:                { present: false }
    Solvantra:            { disposition: CLEAR,   rules: [M-010], proposed: 11.0 }
    Kilnbrook:            { disposition: REVIEW,  rules: [M-060], proposed: 4.9,  flags_must: [X-107] }
    Ambercrest:           { disposition: CLEAR,   rules: [M-020], proposed: 0.0,  realized_quarter: 16.8, status: Acquired }
    Oxbowlane:            { disposition: BLOCK,   rules: [M-050], proposed: 20.65 }
    Willowmere Compute:   { disposition: MONITOR, rules: [M-070], proposed: 4.7 }
    Zerocrest:            { rules: [M-000], proposed: 0.0, status: "Shut Down" }

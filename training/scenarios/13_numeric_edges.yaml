name: 13_numeric_edges
description: >
  Numbers at the edge of meaning. Ownership after = 0 on a secondary (HC sold everything: mark 0,
  proceeds realized, nothing blocks). Ownership after = 150 (points cannot exceed 100: X-903 and
  the row blocks — the engine must not book 150 × post). Negative proceeds on an exit and a
  post-money of 0 on a priced round are data errors that must block the row, not produce a
  number. A deal value of 1e12 is dollars (X-916 → $1,000,000M) and the arithmetic follows.
base: HC_Mock_Portfolio_Data.xlsx
policy: 2026Q3
activity:
  - { date: 2026-07-10, company: "Lanternfell Space", event: "Secondary Sale", detail: "HC sold its entire position", value: 653.6, ownership_after: 0, proceeds: 37.2552,
      notes: "Buyer paid a price consistent with the latest round." }
  - { date: 2026-07-14, company: Solvantra, event: "Priced Equity Round", detail: "Series B", value: 100.0, hc_investment: 1.0, ownership_after: 150,
      notes: "$24.0M round led by a new investor. HC participated." }
  - { date: 2026-07-28, company: Ambercrest, event: "Acquisition (Closed)", detail: "All-cash acquisition", value: 400.0, proceeds: -16.8,
      notes: "Transaction closed and cash received during the quarter." }
  - { date: 2026-08-03, company: Kilnbrook, event: "Priced Equity Round", detail: "Series B", value: 0, ownership_after: 0.07,
      notes: "$15.0M round led by a new investor. HC did not participate." }
  - { date: 2026-08-07, company: Oxbowlane, event: "Acquisition (Announced)", detail: "Definitive agreement signed, all cash", value: 1000000000000,
      notes: "Expected to close in Q4 2026, subject to regulatory approval. No cash received." }
expect:
  ingest_ok: true
  no_crash: true
  validation_ids: { must: [X-903, X-916], must_not: [X-901, X-909, X-914] }
  validation_must:
    - { id: X-903, company: Solvantra, blocking: true }
    - { company: Ambercrest, blocking: true }
    - { company: Kilnbrook, blocking: true }
    - { id: X-916, company: Oxbowlane }
  validation_must_not:
    - { id: X-903, company: "Lanternfell Space" }
    - { company: "Lanternfell Space", blocking: true }
  validation_blocking: true
  totals: { events: 5, positions: 100 }
  companies:
    Lanternfell Space:    { disposition: CLEAR, rules: [M-030], proposed: 0.0, realized_quarter: 37.2552, ownership_after: 0.0, flags_must_not: [X-104, X-101] }
    Solvantra:            { disposition: BLOCK, flags_must_not: [X-102] }
    Ambercrest:           { disposition: BLOCK }
    Kilnbrook:            { disposition: BLOCK, flags_must_not: [X-102] }
    Oxbowlane:            { disposition: BLOCK, rules: [M-050], proposed: 38701.3, flags_must: [X-101] }

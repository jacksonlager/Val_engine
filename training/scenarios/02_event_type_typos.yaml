name: 02_event_type_typos
description: >
  The eight original event types spelled the way a human produces them under deadline: transposed
  letters, a dropped letter, trailing/leading spaces, mixed case. Each must resolve (X-912, never
  silently) and still drive the right rule. One bare "Acquisition" is ambiguous (closed or
  announced?) and must X-914 rather than be guessed.
base: HC_Mock_Portfolio_Data.xlsx
policy: 2026Q3
activity:
  - { date: 2026-07-10, company: Solvantra, event: "Priced Equtiy Round", detail: "Series B", value: 100.0, hc_investment: 1.0, ownership_after: 0.11,
      notes: "$24.0M round led by a new investor. HC participated." }
  - { date: 2026-07-14, company: Kilnbrook, event: "Convertable Note", detail: "$3.0M bridge note, $80.0M valuation cap", hc_investment: 0.5,
      notes: "Uncapped interest, converts at next priced round. HC participated in the note." }
  - { date: 2026-07-20, company: Vinecroft, event: "IPO ", detail: "Listed on Nasdaq", value: 2500.0, ownership_after: 0.014,
      notes: "Priced at the midpoint of the range." }
  - { date: 2026-07-28, company: Ambercrest, event: "Aquisition (Closed)", detail: "All-cash acquisition", value: 400.0, proceeds: 16.8,
      notes: "Transaction closed and cash received during the quarter." }
  - { date: 2026-08-03, company: Oxbowlane, event: "acquisition (announced)", detail: "Definitive agreement signed, all cash", value: 500.0,
      notes: "Expected to close in Q4 2026, subject to regulatory approval. No cash received." }
  - { date: 2026-08-07, company: "Coppermoss Energy", event: "Shutdwon", detail: "Ceased operations", proceeds: 0.1,
      notes: "Board voted to wind down. Residual cash distributed to investors." }
  - { date: 2026-08-11, company: "Lanternfell Space", event: "Secondry Sale", detail: "HC sold 30% of its position", value: 653.6, ownership_after: 0.04, proceeds: 11.1112,
      notes: "Buyer paid a price consistent with the latest round." }
  - { date: 2026-08-14, company: "Willowmere Compute", event: "Term Sheet Signd", detail: "Series B term sheet at ~$60.0M post", value: 60.0,
      notes: "Not closed; diligence underway, expected to close Q4." }
  - { date: 2026-08-20, company: "Palefire Labs", event: "  priced equity round  ", detail: "Series B", value: 90.0, hc_investment: 0.8, ownership_after: 0.115,
      notes: "$20.0M round led by a new investor. HC participated." }
  - { date: 2026-09-01, company: Quillshade, event: "Acquisition", detail: "Deal with a strategic buyer", value: 200.0, proceeds: 27.0,
      notes: "Closed or announced is not stated on this row." }
expect:
  ingest_ok: true
  no_crash: true
  validation_ids: { must: [X-912, X-914], must_not: [X-901, X-913, X-902, X-903, X-907] }
  validation_must:
    - { id: X-912, contains: "Priced Equtiy Round" }
    - { id: X-912, contains: "Aquisition (Closed)" }
    - { id: X-912, contains: "Shutdwon" }
    - { id: X-914, company: Quillshade }
  validation_must_not:
    - { id: X-914, company: Solvantra }
    - { id: X-914, company: Ambercrest }
  totals: { events: 10, positions: 100 }
  companies:
    Solvantra:            { disposition: CLEAR,   rules: [M-010], proposed: 11.0,   flags_must_not: [M-999] }
    Kilnbrook:            { disposition: REVIEW,  rules: [M-060], proposed: 4.9,    flags_must: [X-107], flags_must_not: [M-999] }
    Vinecroft:            { disposition: BLOCK,   rules: [M-040], proposed: 35.0,   flags_must: [X-101], flags_must_not: [M-999] }
    Ambercrest:           { disposition: CLEAR,   rules: [M-020], proposed: 0.0,    realized_quarter: 16.8, status: Acquired, flags_must_not: [M-999] }
    Oxbowlane:            { disposition: BLOCK,   rules: [M-050], proposed: 20.65,  flags_must: [X-101], flags_must_not: [M-999] }
    Coppermoss Energy:    { disposition: CLEAR,   rules: [M-021], proposed: 0.0,    status: "Shut Down", flags_must_not: [M-999] }
    Lanternfell Space:    { disposition: CLEAR,   rules: [M-030], proposed: 26.144, flags_must_not: [M-999, X-104] }
    Willowmere Compute:   { disposition: MONITOR, rules: [M-070], proposed: 4.7,    flags_must: [X-109], flags_must_not: [M-999] }
    Palefire Labs:        { disposition: CLEAR,   rules: [M-010], proposed: 10.35,  flags_must_not: [M-999] }
    Quillshade:           { disposition: BLOCK,   rules: [M-999], proposed: 8.9,    flags_must: [M-999] }

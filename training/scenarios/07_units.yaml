name: 07_units
description: >
  Right numbers, wrong units: post-money and proceeds typed in dollars instead of $M, ownership
  typed in percentage points instead of a fraction — in the activity tab and in the Portfolio tab.
  Each must be recognised (X-916, REVIEW, non-blocking, carrying the assumption) and the marks must
  come out identical to the clean-unit file. Nothing here may block: after the unit correction the
  prior-mark reconciliation (X-904) ties.
base: HC_Mock_Portfolio_Data.xlsx
policy: 2026Q3
portfolio_mutations:
  Rivenmark:
    "Ownership (FD %)": 12
    "Latest Post-Money ($M)": 23900000
    "Prior Mark ($M)": 2900000
  Gorseline:
    "Ownership (FD %)": 10.2
activity:
  - { date: 2026-07-10, company: Solvantra, event: "Priced Equity Round", detail: "Series B", value: 100000000, hc_investment: 1000000, ownership_after: 11,
      notes: "$24.0M round led by a new investor. HC participated." }
  - { date: 2026-07-28, company: Ambercrest, event: "Acquisition (Closed)", detail: "All-cash acquisition", value: 400000000, proceeds: 16800000,
      notes: "Transaction closed and cash received during the quarter." }
  - { date: 2026-08-11, company: "Lanternfell Space", event: "Secondary Sale", detail: "HC sold 30% of its position", value: 653600000, ownership_after: 4.0, proceeds: 11111200,
      notes: "Buyer paid a price consistent with the latest round." }
  - { date: 2026-08-14, company: "Willowmere Compute", event: "Term Sheet Signed", detail: "Series B term sheet at ~$60.0M post", value: 60000000,
      notes: "Not closed; diligence underway, expected to close Q4." }
expect:
  ingest_ok: true
  no_crash: true
  validation_ids: { must: [X-916], must_not: [X-903, X-909, X-901, X-902, X-914] }
  validation_must:
    - { id: X-916, company: Solvantra }
    - { id: X-916, company: Ambercrest }
    - { id: X-916, company: "Lanternfell Space" }
    - { id: X-916, company: Rivenmark }
    - { id: X-916, company: Gorseline }
  validation_blocking: false
  totals: { events: 4, positions: 100 }
  companies:
    Solvantra:            { disposition: CLEAR,   rules: [M-010], proposed: 11.0,   invested_after: 6.1, ownership_after: 0.11, latest_post_money: 100.0 }
    Ambercrest:           { disposition: CLEAR,   rules: [M-020], proposed: 0.0,    realized_quarter: 16.8, status: Acquired, flags_must_not: [X-101] }
    Lanternfell Space:    { disposition: CLEAR,   rules: [M-030], proposed: 26.144, realized_quarter: 11.1112, ownership_after: 0.04, flags_must_not: [X-104] }
    Willowmere Compute:   { disposition: MONITOR, rules: [M-070], proposed: 4.7,    flags_must: [X-109], alternative_marks: { term_sheet_indicated: 7.26 } }
    Rivenmark:            { disposition: CLEAR,   rules: [M-000], proposed: 2.9,    ownership_after: 0.12, latest_post_money: 23.9 }
    Gorseline:            { disposition: CLEAR,   rules: [M-000], proposed: 3.1,    ownership_after: 0.102 }

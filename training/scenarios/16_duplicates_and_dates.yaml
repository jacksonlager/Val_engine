name: 16_duplicates_and_dates
description: >
  Rows a copy-paste produces: an exact duplicate of a round (X-906 BLOCK on both copies: the
  engine will not apply a transaction twice or choose which copy is real, so Solvantra carries its
  prior mark and blocks on X-900 until the paste is removed — before HARDENING_REPORT.md D-10 the
  duplicate was a non-blocking REVIEW and HC's 1.0 cheque was booked twice), an exit dated before
  the window opens (X-905), a note dated in 2030
  (X-905), a date typed as "14-Aug-2026" text (X-915), and a day-first/month-first ambiguity
  "09/03/2026" that must be read month-first (3 September, inside the window) with an X-915
  that says so.
base: HC_Mock_Portfolio_Data.xlsx
policy: 2026Q3
activity:
  - { date: 2026-07-10, company: Solvantra, event: "Priced Equity Round", detail: "Series B", value: 100.0, hc_investment: 1.0, ownership_after: 0.11,
      notes: "$24.0M round led by a new investor. HC participated." }
  - { date: 2026-07-10, company: Solvantra, event: "Priced Equity Round", detail: "Series B", value: 100.0, hc_investment: 1.0, ownership_after: 0.11,
      notes: "$24.0M round led by a new investor. HC participated." }
  - { date: 2026-06-28, company: Ambercrest, event: "Acquisition (Closed)", detail: "All-cash acquisition", value: 400.0, proceeds: 16.8,
      notes: "Transaction closed and cash received during the quarter." }
  - { date: 2030-01-01, company: Kilnbrook, event: "Convertible Note", detail: "$3.0M bridge note, $80.0M valuation cap", hc_investment: 0.5,
      notes: "Uncapped interest, converts at next priced round. HC participated in the note." }
  - { date: "14-Aug-2026", company: "Willowmere Compute", event: "Term Sheet Signed", detail: "Series B term sheet at ~$60.0M post", value: 60.0,
      notes: "Not closed; diligence underway, expected to close Q4." }
  - { date: "09/03/2026", company: Oxbowlane, event: "Acquisition (Announced)", detail: "Definitive agreement signed, all cash", value: 500.0,
      notes: "Expected to close in Q4 2026, subject to regulatory approval. No cash received." }
expect:
  ingest_ok: true
  no_crash: true
  validation_ids: { must: [X-906, X-905, X-915], must_not: [X-901, X-909, X-914] }
  validation_must:
    - { id: X-906, company: Solvantra, blocking: true, count: 2 }
    - { id: X-905, company: Ambercrest }
    - { id: X-905, company: Kilnbrook, contains: "2030" }
    - { id: X-915, company: "Willowmere Compute", contains: "14-Aug-2026" }
    - { id: X-915, company: Oxbowlane, contains: "ambig" }
  validation_must_not:
    - { id: X-905, company: Oxbowlane }
  totals: { events: 6, positions: 100 }
  companies:
    Solvantra:            { disposition: BLOCK, rules_contains: [M-000], proposed: 8.9, ownership_after: 0.118, invested_after: 5.1, flags_must: [X-900], flags_must_not: [M-999, M-010] }
    Ambercrest:           { rules_contains: [M-020], proposed: 0.0, realized_quarter: 16.8, status: Acquired }
    Willowmere Compute:   { disposition: MONITOR, rules: [M-070], proposed: 4.7 }
    Oxbowlane:            { disposition: BLOCK, rules: [M-050], proposed: 20.65 }

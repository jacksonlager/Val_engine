name: 04_company_name_variants
description: >
  Company names as they arrive from a deal team: wrong case, doubled spaces, a corporate suffix,
  a "(formerly …)" rename, a one-letter typo. Each must resolve to the book (X-913) and drive the
  right rule. A fake "Aravine Labs" is added to the book so that "Aravin" sits between two
  candidates and must X-914 — neither Aravine nor Aravine Labs may be re-marked from that row.
  A second fake row "Kilnbrooks" makes "Kilnbrooke" sit at distance 1 from two book names — the
  ambiguity SPEC §2.3's own Damerau-Levenshtein rule produces — and must X-914 too. A genuinely
  unknown company still raises X-901.

name: 21_refused_and_applied
description: >
  One company, one quarter, one row the ingest layer refused and one it accepted. The refused row
  must be recorded (M-000 "recorded but not applied", X-900 BLOCK) without disturbing the accepted
  one, in either order. Solvantra: a term sheet with a negative indicated value (X-903) then a
  clean Series B — mark 0.11 × 100 = 11.0, invested 5.1 + 1.0 = 6.1, no term-sheet open item.
  Lanternfell Space: a clean Series D (0.05 × 800 = 40.0) then a secondary whose ownership-after is
  150 points (X-903) — nothing sold, nothing realized, ownership stays 0.05. Kilnbrook: a note with a
  negative HC investment (X-903) then a clean Series B — 0.075 × 90 = 6.75, no note leg, invested
  unchanged at 2.0, no X-107. Ambercrest: a clean Series C (0.045 × 300 = 13.5, invested 6.6) then a
  closed acquisition with a negative deal value (X-903) — the exit is not booked: still Active,
  nothing realized, no X-101. Every one of the four is BLOCK because of the refused row alone.
base: HC_Mock_Portfolio_Data.xlsx
policy: 2026Q3
activity:
  - { date: 2026-07-05, company: Solvantra, event: "Term Sheet Signed", detail: "Series B term sheet", value: -30.0,
      notes: "Indicated post typed with the wrong sign." }
  - { date: 2026-08-10, company: Solvantra, event: "Priced Equity Round", detail: "Series B", value: 100.0, hc_investment: 1.0, ownership_after: 0.11,
      notes: "$24.0M round led by a new investor. HC participated." }
  - { date: 2026-07-10, company: "Lanternfell Space", event: "Priced Equity Round", detail: "Series D", value: 800.0, ownership_after: 0.05,
      notes: "$120.0M round led by a new investor. HC did not participate." }
  - { date: 2026-08-15, company: "Lanternfell Space", event: "Secondary Sale", detail: "HC sold part of its position", value: 800.0, ownership_after: 150, proceeds: 8.0,
      notes: "Ownership after typed as 150." }
  - { date: 2026-07-20, company: Kilnbrook, event: "Convertible Note", detail: "$3.0M bridge note, $80.0M valuation cap", hc_investment: -0.5,
      notes: "HC participation typed with the wrong sign." }
  - { date: 2026-09-01, company: Kilnbrook, event: "Priced Equity Round", detail: "Series B", value: 90.0, ownership_after: 0.075,
      notes: "$15.0M round led by a new investor. HC did not participate." }
  - { date: 2026-07-15, company: Ambercrest, event: "Priced Equity Round", detail: "Series C", value: 300.0, hc_investment: 1.0, ownership_after: 0.045,
      notes: "$30.0M round led by a new investor. HC participated." }
  - { date: 2026-09-10, company: Ambercrest, event: "Acquisition (Closed)", detail: "All-cash acquisition", value: -400.0, proceeds: 18.0,
      notes: "Deal value typed with the wrong sign." }
expect:
  ingest_ok: true
  no_crash: true
  validation_ids: { must: [X-903], must_not: [X-901, X-909, X-914, X-902, X-907] }
  validation_must:
    - { id: X-903, company: Solvantra, blocking: true, count: 1 }
    - { id: X-903, company: "Lanternfell Space", blocking: true, count: 1 }
    - { id: X-903, company: Kilnbrook, blocking: true, count: 1 }
    - { id: X-903, company: Ambercrest, blocking: true, count: 1 }
  validation_blocking: true
  totals: { events: 8, positions: 100 }
  companies:
    Solvantra:            { disposition: BLOCK, rules: [M-000, M-010], proposed: 11.0, invested_after: 6.1, ownership_after: 0.11, latest_post_money: 100.0,
                            flags_must: [X-900], flags_must_not: [X-109, M-999, X-102, X-106], open_items_count: 0 }
    Lanternfell Space:    { disposition: BLOCK, rules: [M-010, M-000], proposed: 40.0, realized_quarter: 0.0, ownership_after: 0.05, latest_post_money: 800.0,
                            flags_must: [X-900], flags_must_not: [X-104, X-101, X-103, M-999] }
    Kilnbrook:            { disposition: BLOCK, rules: [M-000, M-010], proposed: 6.75, note_at_cost: 0.0, equity_mark: 6.75, invested_after: 2.0, ownership_after: 0.075,
                            flags_must: [X-900], flags_must_not: [X-107, X-108, M-999], open_items_count: 0 }
    Ambercrest:           { disposition: BLOCK, rules: [M-010, M-000], proposed: 13.5, invested_after: 6.6, realized_quarter: 0.0, ownership_after: 0.045, status: Active,
                            flags_must: [X-900], flags_must_not: [X-101, M-999] }

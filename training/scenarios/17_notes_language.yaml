name: 17_notes_language
description: >
  One row per X-105 note-screen term (the thirteen the policy already lists plus the nine SPEC §3
  adds: warrant, pay-to-play, cram / cram-down, lock-up, related party, going concern, covenant,
  default), each on a Term Sheet Signed so the mark is unchanged and the only new signal is the
  REVIEW that guarantees a human reads the sentence. Two controls: "lock-up" in an IPO note must
  NOT fire (it is the normal condition of a listing), and a clean note must not fire at all.
base: HC_Mock_Portfolio_Data.xlsx

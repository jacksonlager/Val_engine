name: 10_multi_event
description: >
  Companies with more than one event in the quarter, applied chronologically: round then round,
  round then closed exit, note then round (the note converts and its open item and cost leg are
  extinguished), announced then closed (the announcement is superseded), shutdown then a stray
  later term sheet (suppressed, nothing leaks), secondary sale then round (the remainder is
  repriced by the round).
base: HC_Mock_Portfolio_Data.xlsx
policy: 2026Q3
activity:
  # round + round (sheet order deliberately reversed: the engine must sort by date)
  - { date: 2026-09-05, company: Solvantra, event: "Priced Equity Round", detail: "Series C", value: 105.0, ownership_after: 0.10,
      notes: "$18.0M round led by a new investor. HC did not participate." }
  - { date: 2026-07-10, company: Solvantra, event: "Priced Equity Round", detail: "Series B", value: 100.0, hc_investment: 1.0, ownership_after: 0.11,
      notes: "$24.0M round led by a new investor. HC participated." }
  # round then closed exit
  - { date: 2026-07-15, company: Ambercrest, event: "Priced Equity Round", detail: "Series C", value: 300.0, hc_investment: 1.0, ownership_after: 0.045,
      notes: "$30.0M round led by a new investor. HC participated." }
  - { date: 2026-09-10, company: Ambercrest, event: "Acquisition (Closed)", detail: "All-cash acquisition", value: 400.0, proceeds: 18.0,
      notes: "Transaction closed and cash received during the quarter." }
  # note then round (conversion)
  - { date: 2026-07-20, company: Kilnbrook, event: "Convertible Note", detail: "$3.0M bridge note, $80.0M valuation cap", hc_investment: 0.5,
      notes: "Uncapped interest, converts at next priced round. HC participated in the note." }
  - { date: 2026-09-12, company: Kilnbrook, event: "Priced Equity Round", detail: "Series B", value: 90.0, ownership_after: 0.075,
      notes: "$15.0M round led by a new investor; the July bridge converted into the round." }
  # announced then closed
  - { date: 2026-08-01, company: Oxbowlane, event: "Acquisition (Announced)", detail: "Definitive agreement signed, all cash", value: 500.0,
      notes: "Expected to close within the quarter." }
  - { date: 2026-09-20, company: Oxbowlane, event: "Acquisition (Closed)", detail: "All-cash acquisition", value: 500.0, proceeds: 21.5,
      notes: "Transaction closed and cash received during the quarter." }
  # shutdown then a later term sheet
  - { date: 2026-08-05, company: "Coppermoss Energy", event: "Shutdown", detail: "Ceased operations",
      notes: "Board voted to wind down. No recovery expected." }
  - { date: 2026-09-01, company: "Coppermoss Energy", event: "Term Sheet Signed", detail: "Stray row after the shutdown", value: 30.0,
      notes: "Entered in error." }
  # secondary sale then round
  - { date: 2026-07-25, company: "Lanternfell Space", event: "Secondary Sale", detail: "HC sold 30% of its position", value: 653.6, ownership_after: 0.04, proceeds: 11.1112,
      notes: "Buyer paid a price consistent with the latest round." }
  - { date: 2026-09-15, company: "Lanternfell Space", event: "Priced Equity Round", detail: "Series D", value: 800.0, ownership_after: 0.038,
      notes: "$120.0M round led by a new investor. HC did not participate." }
expect:
  ingest_ok: true
  no_crash: true
  validation_ids: { must: [], must_not: [X-901, X-909, X-906, X-907, X-902, X-903] }
  totals: { events: 12, positions: 100 }
  companies:
    Solvantra:            { disposition: CLEAR, rules: [M-010, M-010], proposed: 10.5, invested_after: 6.1, ownership_after: 0.10, latest_post_money: 105.0, flags_must_not: [X-106, X-102] }
    Ambercrest:           { disposition: CLEAR, rules: [M-010, M-020], proposed: 0.0, invested_after: 6.6, realized_quarter: 18.0, status: Acquired, flags_must_not: [X-101] }
    Kilnbrook:            { rules: [M-060, M-010], proposed: 6.75, note_at_cost: 0.0, equity_mark: 6.75, invested_after: 2.5, ownership_after: 0.075, flags_must: [X-124], flags_must_not: [X-107], open_items_must_not: [convertible_note] }
    Oxbowlane:            { disposition: CLEAR, rules: [M-000, M-020], proposed: 0.0, realized_quarter: 21.5, status: Acquired, open_items_count: 0, flags_must_not: [X-101] }
    Coppermoss Energy:    { disposition: CLEAR, rules: [M-021, M-000], proposed: 0.0, status: "Shut Down", open_items_count: 0, flags_must_not: [X-109] }
    Lanternfell Space:    { disposition: CLEAR, rules: [M-030, M-010], proposed: 30.4, realized_quarter: 11.1112, ownership_after: 0.038, latest_post_money: 800.0, flags_must_not: [X-104] }

name: 14_missing_required
description: >
  Rows missing the one field their rule cannot do without: a priced round with no post-money, an
  IPO with no ownership after, a closed exit with no deal value, a note whose Detail carries no
  parseable cap. The first three are X-902 (BLOCK) and the position must block with its prior
  mark intact — the engine must not crash on float(None) and must not book a number it could not
  compute. The capless note is not a data error: M-060 applies, the note leg is carried at cost,
  and the missing cap is an X-101 REVIEW for a human to read the terms.
base: HC_Mock_Portfolio_Data.xlsx
policy: 2026Q3
activity:
  - { date: 2026-07-10, company: Solvantra, event: "Priced Equity Round", detail: "Series B", hc_investment: 1.0, ownership_after: 0.11,
      notes: "$24.0M round led by a new investor. HC participated. Post-money not yet confirmed." }
  - { date: 2026-07-20, company: Vinecroft, event: "IPO", detail: "Listed on Nasdaq", value: 2500.0,
      notes: "Priced at the midpoint of the range." }
  - { date: 2026-07-28, company: Ambercrest, event: "Acquisition (Closed)", detail: "All-cash acquisition", proceeds: 16.8,
      notes: "Transaction closed and cash received during the quarter." }
  - { date: 2026-07-14, company: Kilnbrook, event: "Convertible Note", detail: "$3.0M bridge note, terms per the NPA", hc_investment: 0.5,
      notes: "Uncapped interest, converts at next priced round. HC participated in the note." }
expect:
  ingest_ok: true
  no_crash: true
  validation_ids: { must: [X-902], must_not: [X-901, X-909, X-914] }
  validation_must:
    - { id: X-902, company: Solvantra, blocking: true }
    - { id: X-902, company: Vinecroft, blocking: true }
    - { id: X-902, company: Ambercrest, blocking: true }
  validation_must_not:
    - { id: X-902, company: Kilnbrook }
  validation_blocking: true
  totals: { events: 4, positions: 100 }
  companies:
    Solvantra:            { disposition: BLOCK, proposed: 8.9,  ownership_after: 0.118 }
    Vinecroft:            { disposition: BLOCK, proposed: 22.3, ownership_after: 0.016 }
    Ambercrest:           { disposition: BLOCK }
    Kilnbrook:            { disposition: REVIEW, rules: [M-060], proposed: 4.9, note_at_cost: 0.5, flags_must: [X-107, X-101], open_items_must: [convertible_note] }

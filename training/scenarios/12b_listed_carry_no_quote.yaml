name: 12b_listed_carry_no_quote
description: >
  Same Q4 book as 12_listed_carry, but the measurement-date quote for Drayvenn is removed from
  the market data. A listed position with no price must not be silently carried: the prior mark
  stays (110.068) and the position must BLOCK with X-113 ("supply the close").
base: snapshot:2026Q3
policy: 2026Q4
workbook: 12_listed_carry.xlsx
market: { drop_quotes: [Drayvenn] }
activity:
  - { date: 2026-10-15, company: Solvantra, event: "Priced Equity Round", detail: "Series B", value: 100.0, hc_investment: 1.0, ownership_after: 0.11,
      notes: "$24.0M round led by a new investor. HC participated." }
expect:
  ingest_ok: true
  no_crash: true
  manifest: { quarter_label: "Q4 2026" }
  companies:
    Drayvenn:   { disposition: BLOCK, proposed: 110.068, listed: true, flags_must: [X-113], flags_must_not: [M-999] }
    Solvantra:  { disposition: CLEAR, rules: [M-010], proposed: 11.0 }

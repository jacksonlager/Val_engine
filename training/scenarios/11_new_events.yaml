    Saffronwell:          { disposition: REVIEW,  rules: [M-013], proposed: 1.0608, invested_after: 2.9, ownership_after: 0.068, flags_must: [X-110] }
    Tidewell Health:      { disposition: MONITOR, rules: [M-014], proposed: 2.0, invested_after: 1.9, flags_must: [X-120], flags_must_not: [X-918] }
    Brightmoor Health:    { disposition_in: [MONITOR, REVIEW], rules: [M-014], proposed: 1.2, invested_after: 1.2, ownership_after: 0.10, fund: "Fund III", sector: Healthcare, status: Active, flags_must: [X-120], flags_must_not: [M-999] }
    Inkmoor:              { disposition: REVIEW,  rules: [M-051], proposed: 2.964, flags_must: [X-114] }
    Rivenmark:            { disposition: REVIEW,  rules: [M-061], proposed: 2.9, realized_quarter: 0.4, note_at_cost: 0.0, flags_must: [X-115] }
    Zerocrest:            { disposition_in: [CLEAR, MONITOR, REVIEW], rules_contains: [M-061], rules_must_not: [M-999], proposed: 0.0, realized_quarter: 0.05, status: "Shut Down" }
    Thornmill Systems:    { disposition: BLOCK,   rules: [M-025], proposed: 28.2, status: Active, flags_must: [X-116] }
    Vexmoor:              { disposition: BLOCK,   rules: [M-040], proposed: 30.0, fv_level: 1, listed: true, flags_must: [X-101], flags_must_not: [M-999] }
    Covebright:           { disposition: BLOCK,   rules: [M-024], proposed: 19.6, status: Active, stage: "Acquired (stock)", latest_post_money: 350.0, realized_quarter: 0.0, flags_must: [X-112], flags_must_not: [M-999], open_items_must: [acquirer_shares] }
    Willowmere Compute:   { disposition: REVIEW,  rules: [M-010], proposed: 9.8, invested_after: 8.0, flags_must: [X-117], flags_must_not: [X-118] }
    Palefire Labs:        { disposition: MONITOR, rules: [M-010], proposed: 10.35, flags_must: [X-118], flags_must_not: [X-117] }
    Harrowgate Bio:       { disposition: BLOCK, flags_must_not: [X-117] }

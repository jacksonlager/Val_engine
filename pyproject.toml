[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hc-valuation"
version = "0.1.0"
description = "Quarterly valuation engine: rolls a venture portfolio forward through an activity feed, proposes marks, and flags what a human must review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — evaluation exercise" }
dependencies = [
    "openpyxl>=3.1,<4",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "python-multipart>=0.0.9",   # multipart uploads: POST /api/upload
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "anthropic>=0.30,<2"]
live = ["httpx>=0.27,<1"]
adjudication = ["anthropic>=0.30,<2"]

[project.scripts]
hc-valuation = "hc_valuation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hc_valuation = ["api/static/**/*", "api/static_exec/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"    # the summary line stays visible; add -q by hand for dots only
